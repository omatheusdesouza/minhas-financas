name: Gerar APK Android (Fynvault)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Testes automáticos (recorrência e lembretes)
        run: npm test

      - name: Montar o app (com as chaves do Supabase)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning::Secrets do Supabase não configurados — o APK vai abrir em modo demonstração."
          fi
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        env:
          # Chave privada (opcional): com ela o APK sai assinado em release; sem ela, usa a chave debug do projeto
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Fynvault.apk
            rm -f "$ANDROID_KEYSTORE_PATH"
          else
            echo "::warning::Sem chave privada (ANDROID_KEYSTORE_BASE64): APK assinado com a chave debug pública do projeto."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Fynvault.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Fynvault-apk
          path: Fynvault.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Fynvault 1.1.${{ github.run_number }}
          body: Baixe o arquivo **Fynvault.apk** abaixo pelo celular Android e instale.
          files: Fynvault.apk
          make_latest: true
